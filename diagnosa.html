<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnosa Koneksi Apps Script | MIW BMKG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="assets/theme-hud.js"></script>
<style>
:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html[data-theme="dark"], html:not([data-theme="light"]) {
  --bg: #060d17;
  --bg-card: rgba(12, 26, 44, 0.85);
  --text: #f0f6fc;
  --text-muted: #8ba2b9;
  --border: rgba(56, 189, 248, 0.2);
  --primary: #00f0ff;
  --primary-text: #030a14;
  --th-bg: rgba(16, 36, 60, 0.9);
  --tr-border: rgba(56, 189, 248, 0.12);
  --code-bg: rgba(4, 13, 24, 0.9);
  --ok: #10b981;
  --bad: #f43f5e;
  --wait: #fbbf24;
}
html[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-card: #ffffff;
  --text: #0c233c;
  --text-muted: #4e6780;
  --border: rgba(186, 206, 224, 0.8);
  --primary: #0d9488;
  --primary-text: #ffffff;
  --th-bg: #eaf1f6;
  --tr-border: #e2e8f0;
  --code-bg: #f8fafc;
  --ok: #059669;
  --bad: #e11d48;
  --wait: #d97706;
}
body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
  padding: 32px 20px;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
}
main {
  max-width: 980px;
  margin: 0 auto;
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
h1 {
  font-size: 1.45rem;
  font-weight: 800;
  margin: 0;
}
p {
  margin: 6px 0 18px;
  color: var(--text-muted);
}
.actions {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
}
button {
  font-family: inherit;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 10px 20px;
  border-radius: 10px;
  border: 0;
  background: var(--primary);
  color: var(--primary-text);
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
}
button:hover:not(:disabled) {
  transform: translateY(-1px);
}
button.sec {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.theme-btn {
  margin-left: auto;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.82rem;
}
.table-wrap {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  background: var(--bg-card);
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--tr-border);
  text-align: left;
  vertical-align: top;
  font-size: 0.88rem;
}
th {
  background: var(--th-bg);
  font-weight: 700;
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}
.ok { color: var(--ok); font-weight: 700; }
.bad { color: var(--bad); font-weight: 700; }
.wait { color: var(--wait); font-weight: 600; }
code {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 6px;
  word-break: break-all;
}
a.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 14px;
}
a.back-link:hover {
  color: var(--primary);
}
</style>
</head>
<body>
<main>
  <a href="index.html" class="back-link">← Kembali ke Beranda</a>
  <div class="header-row">
    <h1>Diagnosa Koneksi Apps Script</h1>
    <button class="theme-toggle-btn theme-btn" type="button">TEMA</button>
  </div>
  <p>Klik <b>Mulai tes</b> untuk memverifikasi kesiapan komunikasi dengan backend Google Apps Script. Hasil dapat disalin untuk pelaporan.</p>
  
  <div class="actions">
    <button id="go">Mulai tes</button>
    <button id="copy" class="sec" disabled>Salin hasil</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Modul</th><th>Tes</th><th>Hasil</th><th>Waktu</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="assets/config.js"></script>
  <script>
  var rows = document.getElementById('rows'), report = [];
  function add(app, test) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><b>' + app + '</b></td><td>' + test + '</td><td class="wait">sedang berjalan...</td><td></td>';
    rows.appendChild(tr);
    return tr;
  }
  function done(tr, ok, msg, ms, app, test) {
    tr.children[2].className = ok ? 'ok' : 'bad';
    tr.children[2].textContent = msg;
    tr.children[3].textContent = ms + ' ms';
    report.push(app + ' | ' + test + ' | ' + (ok ? 'OK' : 'GAGAL') + ' | ' + msg + ' | ' + ms + ' ms');
  }
  function short(u) { return u.replace(/(macros\/(?:a\/[^/]+\/)?s\/.{6}).*(\/exec)/, '$1...$2'); }
  async function t(app, test, fn) {
    var tr = add(app, test), t0 = Date.now();
    try {
      var m = await fn();
      done(tr, true, m, Date.now() - t0, app, test);
    } catch(e) {
      done(tr, false, (e.name || 'Error') + ': ' + e.message, Date.now() - t0, app, test);
    }
  }
  function post(url, fn, args, mode) {
    return fetch(url, {
      method: 'POST',
      mode: mode || 'cors',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args || [] })
    });
  }
  async function cors(url, fn, args) {
    var r = await post(url, fn, args);
    var txt = await r.text();
    var j;
    try { j = JSON.parse(txt); }
    catch(e) { throw new Error('HTTP ' + r.status + ', bukan JSON: ' + txt.slice(0, 80).replace(/\s+/g, ' ')); }
    if (!j.ok) throw new Error('server membalas galat: ' + j.error);
    return 'JSON ok (' + JSON.stringify(j.result).slice(0, 70) + ')';
  }
  async function nocors(url, fn, args) {
    await post(url, fn, args, 'no-cors');
    return 'permintaan terkirim (no-cors ok)';
  }
  document.getElementById('go').onclick = async function () {
    this.disabled = true;
    rows.innerHTML = '';
    report = ['Browser: ' + navigator.userAgent, 'Halaman: ' + location.href];
    var cfg = window.MIW_CONFIG, apps = Object.keys(cfg);
    for (var i = 0; i < apps.length; i++) {
      var a = apps[i], u = cfg[a];
      report.push('URL ' + a + ': ' + short(u));
      if (/^ISI_URL/.test(u)) {
        await t(a, 'URL di config.js', async function () { throw new Error('belum diisi'); });
        continue;
      }
      await t(a, 'Buka alamat (GET)', async function () { await fetch(u, { mode: 'no-cors' }); return 'alamat terjangkau'; });
      await t(a, 'bridgePing (baca JSON)', function () { return cors(u, 'bridgePing'); });
      await t(a, 'bridgePing (tanpa CORS)', function () { return nocors(u, 'bridgePing'); });
    }
    if (cfg.fod && !/^ISI_URL/.test(cfg.fod)) {
      var f = cfg.fod;
      await t('fod', 'getOperationalDate', function () { return cors(f, 'getOperationalDate'); });
      var types = ['synergie', 'upt', 'mfstudio', 'diseminasi', 'rob'];
      for (var k = 0; k < types.length; k++) {
        var ty = types[k];
        await t('fod', 'monitoring: ' + ty, (function (x) {
          return function () { return cors(f, 'getMonitoringEmbedUrl', [x, false]); };
        })(ty));
      }
    }
    document.getElementById('copy').disabled = false;
    this.disabled = false;
  };
  document.getElementById('copy').onclick = function () {
    var s = report.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(
      function () { alert('Hasil diagnosa berhasil disalin.'); },
      function () { prompt('Salin teks hasil diagnosa berikut:', s); }
    );
  };
  </script>
</main>
</body>
</html>
